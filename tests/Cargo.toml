[package]
name = "givre-tests"
version = "0.1.0"
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
givre = { workspace = true, features = ["all-ciphersuites", "cggmp21-keygen", "spof", "hd-wallet", "full-signing"] }

generic-tests = "0.1"
test-case = "3.3"

rand = "0.10"
rand_core = "0.6"
rand_dev = "0.1"

hex = "0.4"
hex-literal = "0.4"

round-based = { workspace = true, features = ["sim"] }

ed25519 = { package = "ed25519-dalek", version = "2.1" }
secp256k1 = { version = "0.29", features = ["global-context"] }
bitcoin = "0.32"

anyhow = "1"
